name: YouPub - fabrication et essai de l'écran voiture

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 31
            profile: pixel_c
          - api: 30
            profile: pixel_5
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer l'appli à essayer
        run: curl -sSfL -o YouPub.apk https://raw.githubusercontent.com/hadesdray-crypto/youpub-maj/essai/YouPub.apk && ls -l YouPub.apk
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Essai sur appareil virtuel
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: |
            adb install -r YouPub.apk
            adb root && sleep 3 && adb wait-for-device
            adb shell "D=/data/data/fr.hadesdray.youpub; mkdir -p \$D/shared_prefs; printf '<?xml version=\"1.0\" encoding=\"utf-8\" standalone=\"yes\" ?>\n<map><boolean name=\"owner\" value=\"true\" /></map>\n' > \$D/shared_prefs/youpub_licence.xml; U=\$(stat -c %u \$D); chown -R \$U:\$U \$D/shared_prefs; chmod 660 \$D/shared_prefs/youpub_licence.xml; restorecon -R \$D/shared_prefs || true"
            adb shell pm grant fr.hadesdray.youpub android.permission.RECORD_AUDIO || true
            adb logcat -c
            adb shell am start -n fr.hadesdray.youpub/.ui.SimpleActivity
            sleep 12
            adb shell screencap -p /sdcard/a.png && adb pull /sdcard/a.png 1-simple.png
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 1
            sleep 6
            adb shell screencap -p /sdcard/a2.png && adb pull /sdcard/a2.png 2-simple-couche.png
            adb shell settings put system user_rotation 0
            sleep 3
            adb shell am start -n fr.hadesdray.youpub/.ui.LibraryActivity
            sleep 6
            adb shell screencap -p /sdcard/b.png && adb pull /sdcard/b.png 3-bibliotheque.png
            adb shell am start -n fr.hadesdray.youpub/.ui.CarActivity
            sleep 8
            adb shell screencap -p /sdcard/c.png && adb pull /sdcard/c.png 4-voiture.png
            bash outils/essai-etoiles.sh > etoiles.txt 2>&1 || true
            adb logcat -d > logcat.txt || true
            grep -E "FATAL|AndroidRuntime" -A 30 logcat.txt | head -200 > plantages.txt || true
            grep -E " I YouPub" logcat.txt | head -100 > journal-lecture.txt || true
      - name: Déposer les captures d'écran
        if: always()
        run: |
          mkdir -p /tmp/out
          cp *.png *.txt /tmp/out/ 2>/dev/null || true
          cd /tmp/out
          git init -q
          git config user.name "usine"
          git config user.email "usine@users.noreply.github.com"
          git add -A
          git commit -qm "Essai ${{ matrix.profile }}" || true
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/essai-youpub-${{ matrix.profile }}
