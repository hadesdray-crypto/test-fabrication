name: Essai télé (Ma Maison + YouPub TV)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tele:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer les deux applis
        run: |
          git fetch -q --depth 1 origin essai-tv
          git show origin/essai-tv:ma-maison.apk > ma-maison.apk
          git show origin/essai-tv:YouPub-TV.apk > YouPub-TV.apk
          ls -la *.apk
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Télé virtuelle
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash outils/essai-tv.sh > tele.txt 2>&1 || true ; adb logcat -d > logcat.txt || true
      - name: Ranger les captures
        if: always()
        run: |
          mkdir out && cp *.png tele.txt logcat.txt out/ 2>/dev/null || true
          cd out && git init -q && git checkout -q -b resultat-tv
          git config user.name essai && git config user.email essai@users.noreply.github.com
          git add -A && git commit -qm "Essai télé" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" resultat-tv
