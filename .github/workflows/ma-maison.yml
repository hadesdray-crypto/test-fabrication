name: Fabrication Ma Maison

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fabriquer:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Récupérer le code (dépôt public ma-maison)
        uses: actions/checkout@v4
        with:
          repository: hadesdray-crypto/ma-maison
          path: appli
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Fabrication et signature (clé fixe du dépôt)
        working-directory: appli
        run: gradle assembleDebug --no-daemon --console=plain -q
      - name: Déposer les APK (un par processeur) en version publiée de test-fabrication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la appli/app/build/outputs/apk/debug/
          cp appli/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk ma-maison-arm64.apk
          cp appli/app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk ma-maison-arm32.apk
          gh release delete ma-maison-apk --repo ${{ github.repository }} --yes --cleanup-tag || true
          gh release create ma-maison-apk ma-maison-arm64.apk ma-maison-arm32.apk --repo ${{ github.repository }} --title "Ma Maison (fabrication)" --notes "Fichiers de passage, effacés à la fabrication suivante."
