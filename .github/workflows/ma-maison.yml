name: Fabrication Ma Maison

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fabriquer:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Récupérer le code (dépôt public ma-maison)
        uses: actions/checkout@v4
        with:
          repository: hadesdray-crypto/ma-maison
          path: appli
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Fabrication et signature (clé fixe du dépôt)
        working-directory: appli
        run: gradle assembleDebug --no-daemon --console=plain -q
      - name: Déposer les APK (un par processeur) sur la branche apk-ma-maison
        run: |
          ls -la appli/app/build/outputs/apk/debug/
          mkdir sortie
          cp appli/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk sortie/ma-maison-arm64.apk
          cp appli/app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk sortie/ma-maison-arm32.apk
          cd sortie && git init -q && git checkout -q -b apk-ma-maison
          git config user.name "usine" && git config user.email "usine@users.noreply.github.com"
          git add -A && git commit -qm "APK Ma Maison"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk-ma-maison
